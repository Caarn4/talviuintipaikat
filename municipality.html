<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Talviuintipaikat.fi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { --bg:#0b1020; --panel:#0f1730; --panel2:#111c3a; --text:#eaf0ff; --muted:#a9b7e6; --border:rgba(255,255,255,.12); --radius:16px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    main { max-width:1280px; margin:auto; padding:28px 20px 48px; }
    h1 { font-size:clamp(26px,4vw,40px); margin:16px 0 10px; }
    h2 { font-size:22px; margin:0 0 16px; }
    h3 { font-size:17px; margin:0 0 6px; overflow-wrap:anywhere; }
    p { line-height:1.5; }
    .muted,.intro { color:var(--muted); }
    .count { font-weight:700; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 14px; border:1px solid var(--border); border-radius:12px; background:var(--panel2); color:var(--text); text-decoration:none; font:inherit; font-size:14px; }
    .primary { background:#3388ff; color:#fff; }
    a:focus-visible,button:focus-visible { outline:2px solid white; outline-offset:3px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .location-card.partner { padding:10px; border-color:rgba(228,204,145,.5); }
    .partner-label { color:#e4cc91; font-weight:700; font-size:12px; }
    .test-label { font-size:12px; color:var(--muted); margin-left:8px; }
    .partner-body { display:flex; gap:12px; align-items:flex-start; }
    .logo-placeholder { flex:0 0 80px; width:80px; height:80px; display:grid; place-items:center; border:1px dashed var(--border); border-radius:12px; color:var(--muted); font-size:12px; }
    .partner p { margin:0; font-size:13px; }
    .partner .partner-description { margin-top:4px; line-height:1.35; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
    .partner .partner-label { display:inline-block; line-height:1.4; margin-bottom:3px; }
    .partner .test-label { white-space:nowrap; }
    button:disabled { opacity:.55; cursor:default; }
    .layout[hidden] { display:none; }
    .layout { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:24px; align-items:start; }
    .map-panel { grid-column:2; grid-row:1; position:sticky; top:20px; min-width:0; }
    .list-panel { grid-column:1; grid-row:1; min-width:0; }
    #map { height:560px; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel); }
    .location-card { padding:10px; margin-bottom:10px; border:1px solid var(--border); border-radius:var(--radius); background:linear-gradient(180deg,var(--panel),var(--panel2)); }
    .card-copy { min-width:0; }
    .basic-card .address { margin:2px 0 0; font-size:13px; color:var(--muted); }
    .basic-card h3 { margin-bottom:3px; }
    .municipality { margin:0; font-size:13px; color:var(--muted); }
    .badge { display:inline-block; padding:3px 8px; margin-top:6px; border:1px solid var(--border); border-radius:999px; background:rgba(255,255,255,.06); font-size:12px; color:var(--muted); }
    .location-card .actions { margin-top:8px; gap:6px; }
    .location-card .button { min-height:36px; padding:7px 10px; font-size:13px; border-radius:10px; }
    .location-card h3 { font-size:16px; line-height:1.3; }
    #status { color:var(--muted); }
    @media(max-width:760px) {
      main { padding:20px 12px 32px; }
      .layout[hidden] { display:none; }
    .layout { display:flex; flex-direction:column; gap:24px; }
      .map-panel,.list-panel { width:100%; position:static; }
      #map { height:300px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <a class="button" href="/index.html" data-text="back"></a>
    <h1 data-text="heading"></h1>
    <p class="intro" data-text="intro"></p>
    <p class="count" id="count" aria-live="polite" data-text="loadingCount"></p>
  </header>
  <p id="status" role="status" data-text="loading"></p>
  <noscript>Kohdelista ja kartta tarvitsevat JavaScriptin. <a href="/index.html">Takaisin pääkartalle</a>.</noscript>
  <div class="layout" hidden>
    <section class="list-panel" aria-labelledby="list-heading">
      <h2 id="list-heading" data-text="listHeading"></h2>
      <article class="location-card partner" data-aria="partnerTest">
        <div class="partner-body">
          <div class="logo-placeholder" aria-hidden="true" data-text="logo"></div>
          <div class="card-copy">
            <div><span class="partner-label" data-text="partner"></span><span class="test-label" data-title="testHint" data-text="test"></span></div>
            <h3 data-text="partnerName"></h3>
            <p class="municipality" id="partner-city"></p>
            <p class="muted partner-description" data-text="partnerDescription"></p>
          </div>
        </div>
        <div class="actions">
          <button class="button primary" disabled data-text="directions"></button>
          <button class="button" disabled data-text="website"></button>
        </div>
      </article>
      <div id="locations"></div>
    </section>
    <section class="map-panel" aria-labelledby="map-heading">
      <h2 id="map-heading" data-text="mapHeading"></h2>
      <div id="map" data-aria="mapLabel"></div>
      <p id="map-status" class="muted" role="status"></p>
    </section>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/municipalities.js"></script>
<script>
  // Finnish UI package; replace this package when adding another language.
  const UI = {
    locale: 'fi', back: '← Takaisin pääkartalle',
    heading: city => city.locative_fi ? `Talviuintipaikat ${city.locative_fi}` : `Talviuintipaikat – ${city.name_fi}`,
    intro: city => `Löydä avantouinti- ja talviuintipaikat kartalta ja listasta: ${city.name_fi}.`,
    listHeading: city => city.locative_fi ? `Kaikki talviuintipaikat ${city.locative_fi}` : `Kaikki talviuintipaikat – ${city.name_fi}`,
    mapHeading: city => `Kohteet kartalla – ${city.name_fi}`, mapLabel: city => `Talviuintipaikkojen kartta: ${city.name_fi}`,
    loadingCount: 'Ladataan kohdemäärää…', loading: 'Ladataan kohteita…',
    count: n => `${n} ${n === 1 ? 'talviuintipaikka' : 'talviuintipaikkaa'}`,
    directions: 'Reittiohjeet', website: 'Verkkosivu', partner: '★ Kumppanikohde',
    logo: 'Logo / kuva', test: 'TESTI', partnerName: 'Kumppanikohteen nimi',
    partnerDescription: 'Paikka kumppanin lyhyelle esittelylle.', partnerTest: 'Kumppanikortin asettelutesti',
    testHint: 'Asettelutesti, ei oikea kohde', badge: '💡 Käyttäjien vinkkaama', unnamed: 'Nimetön paikka',
    unavailable: 'Kohdemäärä ei saatavilla', loadError: 'Kohteiden lataus epäonnistui. Yritä päivittää sivu uudelleen.',
    empty: 'Kunnasta ei löytynyt kohteita.', missingCity: 'Anna kunta osoitteen city-parametrissa.',
    unknownCity: 'Kuntaa ei löytynyt aineistosta tai nimi on moniselitteinen. Tarkista city-parametri.',
    initialHeading: 'Talviuintipaikat kunnittain', missingPoints: 'Kaikilla listan kohteilla ei ole kartalla näytettävää sijaintia.',
    mapError: 'Kartta ei latautunut. Kohdelista ja linkit ovat silti käytettävissä.'
  };
  const normalizeCity = value => String(value ?? '').trim().normalize('NFC').toLocaleLowerCase(UI.locale);
  const slugCity = value => normalizeCity(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  function cityMetadata(name) {
    return MUNICIPALITY_METADATA.find(city => normalizeCity(city.name_fi) === normalizeCity(name))
      || { name_fi: name, name_en: name, slug: slugCity(name), locative_fi: '' };
  }
  function applyTexts(city) {
    document.querySelectorAll('[data-text]').forEach(el => {
      const value = UI[el.dataset.text];
      el.textContent = typeof value === 'function' ? (city ? value(city) : '') : value;
    });
    for (const [data, attribute] of [['aria', 'aria-label'], ['title', 'title']]) {
      document.querySelectorAll(`[data-${data}]`).forEach(el => {
        const value = UI[el.dataset[data]];
        el.setAttribute(attribute, typeof value === 'function' ? (city ? value(city) : '') : value);
      });
    }
    document.querySelector('h1').textContent = city ? UI.heading(city) : UI.initialHeading;
    document.title = `${city ? UI.heading(city) : UI.initialHeading} | Talviuintipaikat.fi`;
    document.getElementById('partner-city').textContent = city ? city['name_' + UI.locale] || city.name_fi : '';
  }

  const text = value => String(value ?? '').trim();
  function municipality(props) {
    return text(props.kunta || props.paikkakunta || props.municipality || props.city);
  }
  function website(props) {
    for (const value of [props.website, props.url]) {
      const raw = String(value ?? '').trim();
      if (!raw || /\s/.test(raw)) continue;
      try {
        const url = new URL(/^[a-z][a-z\d+.-]*:/i.test(raw) ? raw : 'https://' + raw);
        if (['http:', 'https:'].includes(url.protocol) && url.hostname && !url.username && !url.password) return url.href;
      } catch { /* Try the fallback URL. */ }
    }
    return '';
  }
  function position(feature) {
    const coords = feature.geometry?.coordinates;
    if (feature.geometry?.type !== 'Point' || !Array.isArray(coords)) return null;
    const [lng, lat] = coords;
    return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? [lat, lng] : null;
  }
  function element(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content !== undefined) node.textContent = content;
    return node;
  }
  function link(label, href, primary = false) {
    const a = element('a', 'button' + (primary ? ' primary' : ''), label);
    a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }
  async function loadCity() {
    let features;
    applyTexts('');
    // Rewrites keep the original browser URL: read its single path segment.
    const pathMatch = location.pathname.match(/^\/([^/.]+)\/?$/);
    let pathCity = '';
    try { pathCity = pathMatch ? decodeURIComponent(pathMatch[1]) : ''; } catch { pathCity = '__invalid__'; }
    const requested = pathCity && pathCity !== 'municipality'
      ? pathCity : new URLSearchParams(location.search).get('city');
    if (!requested?.trim()) {
      document.getElementById('count').textContent = '';
      document.getElementById('status').textContent = UI.missingCity;
      return;
    }
    try {
      const response = await fetch('/talviuintipaikat_enriched.geojson', { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      if (data.type !== 'FeatureCollection' || !Array.isArray(data.features)) throw new Error('Virheellinen aineisto');
      const cities = [...new Set(data.features.map(f => municipality(f.properties || {})).filter(Boolean))];
      const exact = cities.filter(city => normalizeCity(city) === normalizeCity(requested));
      const matches = exact.length ? exact : cities.filter(city => slugCity(cityMetadata(city).slug) === slugCity(requested));
      if (matches.length !== 1) {
        document.getElementById('count').textContent = '';
        document.getElementById('status').textContent = UI.unknownCity;
        return;
      }
      const city = matches[0];
      applyTexts(cityMetadata(city));
      document.querySelector('.layout').hidden = false;
      features = data.features.filter(f => normalizeCity(municipality(f.properties || {})) === normalizeCity(city));
      features.sort((a,b) => text(a.properties.nimi || a.properties.name).localeCompare(text(b.properties.nimi || b.properties.name), UI.locale));
    } catch (error) {
      document.getElementById('count').textContent = UI.unavailable;
      document.getElementById('status').textContent = UI.loadError;
      return;
    }
    document.getElementById('count').textContent = UI.count(features.length);
    document.getElementById('status').textContent = features.length ? '' : UI.empty;
    const locations = document.getElementById('locations');
    for (const feature of features) {
      const props = feature.properties || {};
      const name = text(props.nimi || props.name) || UI.unnamed;
      const card = element('article', 'location-card basic-card');
      const copy = element('div', 'card-copy');
      copy.append(element('h3', '', name), element('p', 'municipality', municipality(props)));
      // Use only an explicit address field, never notes or a place name.
      const address = [props.osoite, props.address].find(value => typeof value === 'string' && value.trim());
      if (address) copy.append(element('p', 'address', address.trim()));
      if (props.source === 'user_submission') copy.append(element('span', 'badge', UI.badge));
      card.append(copy);
      const actions = element('div', 'actions');
      const point = position(feature);
      if (point) actions.append(link(UI.directions, 'https://www.google.com/maps?q=' + encodeURIComponent(point.join(',')), true));
      const url = website(props);
      if (url) actions.append(link(UI.website, url));
      card.append(actions); locations.append(card);
    }
    try {
      if (!window.L) throw new Error('Leaflet ei latautunut');
      const map = L.map('map').setView([64.5, 26], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
      const points = [];
      for (const feature of features) {
        const point = position(feature);
        if (!point) continue;
        points.push(point);
        const label = element('span', '', text(feature.properties.nimi || feature.properties.name) || UI.unnamed);
        L.marker(point).addTo(map).bindPopup(label);
      }
      if (points.length) map.fitBounds(L.latLngBounds(points), { padding:[24,24], maxZoom:14 });
      if (points.length !== features.length) document.getElementById('map-status').textContent = UI.missingPoints;
    } catch {
      document.getElementById('map-status').textContent = UI.mapError;
    }
  }
  loadCity();
</script>
</body>
</html>
